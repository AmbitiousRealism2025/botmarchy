name: Desktop Bot Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'hermes-bots-v*'

permissions:
  contents: write

concurrency:
  group: desktop-bot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-signed:
    name: Signed macOS DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build signed Bot DMG
        working-directory: apps/desktop
        env:
          HERMES_DESKTOP_PRODUCT: bot
          VITE_HERMES_DESKTOP_PRODUCT: bot
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:bot:mac:dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bots-macos-dmg
          path: apps/desktop/release/*.dmg

  bot-e2e:
    name: Bot Mode E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Electron
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install Python dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run Bot SKU quality gate
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --project ui \
            src/store/updates.test.ts \
            src/lib/product.test.ts \
            src/lib/bot-group-session.test.ts \
            src/lib/bot-group-chat.test.ts \
            src/app/bot-product/setup-overlay.test.ts \
            src/app/contrib/controller-titlebar.test.ts \
            src/app/connectors/mcp.test.ts
          npm run test:desktop:platforms

      - name: Run Bot SKU packaged E2E
        working-directory: apps/desktop
        env:
          HERMES_DESKTOP_PRODUCT: bot
          VITE_HERMES_DESKTOP_PRODUCT: bot
        run: |
          xvfb-run --auto-servernum npm run test:e2e:bot
